<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Ulang Tahun Cece!</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffe6f0, #fff6e6);
      text-align: center;
      color: #333;
    }
    header {
      background-color: #ffb3c6;
      padding: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
      color: #fff;
    }
    .content {
      padding: 30px;
    }
    .photo {
      border-radius: 50%;
      width: 200px;
      margin-bottom: 20px;
    }
    .game-section, .voice-section {
      margin-top: 40px;
      padding: 20px;
      background: #fff;
      border-radius: 15px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      background-color: #ff4d6d;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #e60039;
    }
    audio {
      margin-top: 15px;
      width: 100%;
    }
    .bg-music {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <header>
    <h1>Selamat Ulang Tahun, Cece!</h1>
  </header>
  <div class="content">
    <img src="cece.jpg" alt="Foto Cece" class="photo" />
    <p>Hari ini, dunia jadi lebih cerah karena kamu lahir anjay! pasti mak bapakmu bangga</p>
    <p>Semoga panjang umur sehat selalu, pokoknya tambah cantikkkkk</p><div class="game-section">
  <h2>isi doa harapanmu disini!</h2>
  <p>jawab yaa:</p>
  <p><strong>Apa harapanmu diumur sekarang</strong></p>
  <input type="text" id="answer" placeholder="Tulis jawabanmu di sini" />
  <br />
  <button onclick="checkAnswer()">Submit</button>
  <p id="result"></p>
</div>

<div class="voice-section" id="voiceNote" style="display: none;">
  <h2>Pesan dari aku buat kamu</h2>
  <audio controls>
    <source src="voice-note.m4a" type="audio/mp4" />
    Browser kamu nggak bisa muter audio ini.
  </audio>
</div>

  </div>  <!-- Musik Latar -->  <div class="bg-music">
    <audio controls autoplay loop>
      <source src="beautiful-maliq.mp4" type="audio/mpeg">
      Lagu nggak bisa diputar di browser ini.
    </audio>
  </div>  <script>
    function checkAnswer() {
      const answer = document.getElementById("answer").value.trim().toLowerCase();
      const result = document.getElementById("result");
      if (answer === " ") {
        result.innerHTML = "hahaha dah ngisi mari kita dengarkan suara merduku wkwk";
        document.getElementById("voiceNote").style.display = "block";
      } 
    }
  </script></body>
</html>
