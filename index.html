<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Selamat Ulang Tahun Cece!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      text-align: center;
      color: #fff;
    }

    h1 {
      margin-top: 30px;
      font-size: 3em;
      text-shadow: 2px 2px 5px #ff6f91;
    }

    .photo {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      margin: 30px auto;
      object-fit: cover;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .game-section {
      margin-top: 50px;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      display: inline-block;
    }

    #clickBtn {
      font-size: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      background-color: #ff6f91;
      color: white;
      cursor: pointer;
    }

    #clickBtn:disabled {
      background-color: #aaa;
    }

    #score {
      font-size: 2em;
      margin-top: 15px;
      color: #fff;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Selamat Ulang Tahun Cece!</h1>

  <!-- Foto Cece -->
  <img src="cece.jpg" alt="Cece" class="photo">

  <!-- Musik ulang tahun -->
  <audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>

  <!-- Game Click Me -->
  <div class="game-section">
    <h2>Main Game Dulu Yuk!</h2>
    <button id="clickBtn" onclick="countClick()">Click Me!</button>
    <p id="score">Skor: 0</p>
  </div>

  <script>
    let score = 0;
    let timeLeft = 10;
    let timerStarted = false;

    function countClick() {
      if (!timerStarted) {
        timerStarted = true;
        let timer = setInterval(() => {
          timeLeft--;
          if (timeLeft === 0) {
            clearInterval(timer);
            document.getElementById("clickBtn").disabled = true;
            document.getElementById("clickBtn").innerText = "Waktu Habis!";
          }
        }, 1000);
      }
      score++;
      document.getElementById("score").innerText = "Skor: " + score;
    }
  </script>
</body>
</html>
